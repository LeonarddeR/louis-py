version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    groups:
      rust:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
