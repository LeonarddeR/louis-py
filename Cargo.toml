[package]
name = "louis-py"
version = "0.1.0"
edition = "2024"
description = "Python bindings for the louis braille translator"
license = "LGPL-2.1-or-later"
repository = "https://github.com/LeonarddeR/louis-py"

[lib]
name = "_louis_py"
crate-type = ["cdylib"]

[dependencies]
louis-rs = { git = "https://github.com/liblouis/louis-rs", rev = "048deaba9e0a1e5acd08adc8a3a8f5f491edf476" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
